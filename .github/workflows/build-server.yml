
# On every push to main: build the Linux dedicated server (MAP-2) with Unity,
# pack it into the Docker image and push it to Docker Hub.
#
# Runs on a SELF-HOSTED Windows runner (your PC) so no Unity license secret is needed:
# the Unity Editor installed and activated on that machine is used directly.
#
# One-time setup:
#   1. GitHub repo -> Settings -> Actions -> Runners -> New self-hosted runner (Windows),
#      install it and add the label "unity" when configuring (./config.cmd ... --labels unity).
#      Tip: use a SHORT folder such as C:\r so Windows paths stay under the length limit.
#   2. Unity 2023.1.22f1 with "Linux Build Support (Mono)" + "Linux Dedicated Server Build Support".
#      Open Unity Hub once and stay signed in so the Personal license is active.
#   3. Docker Desktop installed on the same PC.
#   4. Repo secret: DOCKERHUB_TOKEN (Docker Hub access token, write access).
#      Optional repo secret: DOCKERHUB_USERNAME (defaults to the namespace from IMAGE, e.g. "kushanrandika").
#   Optional repo variables: UNITY_PATH (default below), DEPLOY_GITOPS=true + secret GITOPS_TOKEN
#   to also bump the image tag in the railbound-gitops repo.
#
# Note: the first run imports the whole project into a fresh Library folder and is slow;
# later runs reuse it (the runner workspace is kept between runs).
name: Build & push dedicated server

on:
  push:
    branches: [main]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - "Dockerfile"
      - ".github/workflows/build-server.yml"
  workflow_dispatch:

concurrency:
  group: build-server
  cancel-in-progress: false

env:
  IMAGE: registry.kushanherath.me/railbound-server

  UNITY_DEFAULT_PATH: 'C:\Program Files\Unity\Hub\Editor\2023.1.22f1\Editor\Unity.exe'

  MAP_ASSETS_DEFAULT: 'C:\Users\kushan\Railbound\Assets\TerrainDemoScene_HDRP'

  GITOPS_REPO: OneEngine-studio/railbound-gitops

  GITOPS_VALUES: charts/game-server/values.yaml charts/agones-fleet/values.yaml

jobs:
  build-and-push:
    runs-on: [self-hosted, windows, unity]
    timeout-minutes: 180

    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          clean: false

      # 2. Copy git-ignored map assets
      - name: Copy map assets
        shell: powershell
        run: |
          $src = if ("${{ vars.MAP_ASSETS_DIR }}") {
            "${{ vars.MAP_ASSETS_DIR }}"
          } else {
            $env:MAP_ASSETS_DEFAULT
          }

          if (-not (Test-Path "$src\Scenes\MAP-2.unity")) {
            throw "Map assets not found at '$src'"
          }

          robocopy "$src" "Assets\TerrainDemoScene_HDRP" /E /XO /NFL /NDL /NJH /NJS /NP | Out-Null

          if ($LASTEXITCODE -ge 8) {
            throw "robocopy failed with exit code $LASTEXITCODE"
          }

          if (Test-Path "$src.meta") {
            Copy-Item "$src.meta" "Assets\TerrainDemoScene_HDRP.meta" -Force
          }

          Write-Host "Map assets ready"

          exit 0

      # 3. Build Unity Linux dedicated server
      - name: Build Linux dedicated server
        shell: powershell
        run: |
          $unity = if ($env:UNITY_PATH) {
            $env:UNITY_PATH
          } elseif ("${{ vars.UNITY_PATH }}") {
            "${{ vars.UNITY_PATH }}"
          } else {
            $env:UNITY_DEFAULT_PATH
          }

          if (-not (Test-Path $unity)) {
            throw "Unity not found at $unity"
          }

          if (Test-Path Builds/Server/Linux) {
            Remove-Item -Recurse -Force Builds/Server/Linux
          }

          $log = Join-Path $PWD "unity-build.log"
          $importLog = Join-Path $PWD "unity-import.log"

          function Invoke-Unity([string[]]$UnityArgs, [int]$TimeoutMinutes) {
            $p = Start-Process -FilePath $unity -ArgumentList $UnityArgs -PassThru

            $finished = $p.WaitForExit($TimeoutMinutes * 60 * 1000)

            if (-not $finished) {
              Write-Host "Unity timeout. Stopping process."
              $p.Kill()
            }

            for ($pass = 0; $pass -lt 2; $pass++) {
              Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)" -ErrorAction SilentlyContinue |
                ForEach-Object {
                  Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
                }
            }

            if (-not $finished) {
              return -1
            }

            return $p.ExitCode
          }

          # Import Unity project
          $importCode = Invoke-Unity @(
            '-batchmode',
            '-nographics',
            '-quit',
            '-projectPath',
            "`"$PWD`"",
            '-logFile',
            "`"$importLog`""
          ) 90

          Write-Host "Unity import exit code: $importCode"

          # Build Linux server
          $code = -1

          for ($attempt = 1; $attempt -le 2 -and $code -ne 0; $attempt++) {

            Write-Host "Unity build attempt $attempt"

            $code = Invoke-Unity @(
              '-batchmode',
              '-nographics',
              '-projectPath',
              "`"$PWD`"",
              '-executeMethod',
              'Railbound.Editor.NetcodeServerBuildPipeline.BuildLinuxServerCI',
              '-logFile',
              "`"$log`""
            ) 90

            Write-Host "Build exit code: $code"
          }

          if ($code -ne 0) {
            if (Test-Path $log) {
              Get-Content $log -Tail 80
            }

            throw "Unity build failed"
          }

          if (-not (Test-Path Builds/Server/Linux/RailboundServer.x86_64)) {
            throw "Server binary missing"
          }

          Get-ChildItem Builds/Server/Linux

      # 4. Upload Unity logs if build fails
      - name: Upload Unity logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unity-build-logs
          path: |
            unity-build.log
            unity-import.log

      # 5. Generate unique Docker image tag
      - name: Generate image tag
        id: meta
        shell: powershell
        run: |
          $tag = "sha-" + $env:GITHUB_SHA.Substring(0, 8)

          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag" -Encoding ascii

          Write-Host "Image tag: $tag"

      # 6. Make sure Docker Desktop is running
      - name: Start Docker Desktop
        shell: powershell
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = "Continue"

          # `docker info` against a hung engine never returns; give every probe a time limit so the job fails with a reason
          # instead of sitting there for hours.
          function Test-Docker {
            $p = Start-Process -FilePath docker -ArgumentList 'info' -NoNewWindow -PassThru `
              -RedirectStandardOutput "$env:RUNNER_TEMP\docker-info.out" -RedirectStandardError "$env:RUNNER_TEMP\docker-info.err"
            if (-not $p.WaitForExit(20000)) {
              try { Stop-Process -Id $p.Id -Force } catch { }
              return $false
            }
            return ($p.ExitCode -eq 0)
          }

          if (-not (Test-Docker)) {

            $dd = "$env:LOCALAPPDATA\Programs\DockerDesktop\Docker Desktop.exe"

            if (-not (Test-Path $dd)) {
              $dd = "C:\Program Files\Docker\Docker\Docker Desktop.exe"
            }

            Start-Process $dd

            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep 5
              if (Test-Docker) { break }
            }
          }

          if (-not (Test-Docker)) {
            $os = Get-CimInstance Win32_OperatingSystem
            $freeGb = [math]::Round($os.FreePhysicalMemory / 1MB, 1)
            throw "The Docker engine does not answer (free memory on this PC: $freeGb GB). Close other programs (the Unity editor, browsers) or restart Docker Desktop, then re-run."
          }

      # 7. Login to your OCI private registry
      - name: Login to private registry
        shell: powershell
        timeout-minutes: 4
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Continue"

          $user = if ($env:REGISTRY_USER) { $env:REGISTRY_USER.Trim() } else { "registryadmin" }
          $pass = if ($env:REGISTRY_PASSWORD) { $env:REGISTRY_PASSWORD.Trim() } else { "" }

          # Create an isolated Docker config without credsStore so it works in headless runner sessions
          $dockerCfgDir = Join-Path $env:RUNNER_TEMP "docker-config"
          if (-not (Test-Path $dockerCfgDir)) {
            New-Item -ItemType Directory -Path $dockerCfgDir -Force | Out-Null
          }
          [System.IO.File]::WriteAllText("$dockerCfgDir\config.json", '{"auths":{}}', (New-Object System.Text.UTF8Encoding($false)))
          $env:DOCKER_CONFIG = $dockerCfgDir
          Add-Content -Path $env:GITHUB_ENV -Value "DOCKER_CONFIG=$dockerCfgDir" -Encoding ascii

          Write-Host "Logging into registry.kushanherath.me (user len: $($user.Length), pass len: $($pass.Length))..."

          # The password goes in through stdin from a BOM-free temp file: `docker login -p` shows it in the process list and in
          # the log, and PowerShell 5.1 pipes a BOM in front of it. A time limit stops a hung Docker engine from blocking the job.
          $pwFile = Join-Path $env:RUNNER_TEMP "registry-pass.txt"
          [System.IO.File]::WriteAllText($pwFile, $pass, (New-Object System.Text.UTF8Encoding($false)))
          try {
            $p = Start-Process -FilePath cmd.exe -NoNewWindow -PassThru `
              -ArgumentList "/c", "docker login registry.kushanherath.me -u `"$user`" --password-stdin < `"$pwFile`""
            if (-not $p.WaitForExit(120000)) {
              try { Stop-Process -Id $p.Id -Force } catch { }
              throw "docker login did not finish in 120 s: the Docker engine is not responding"
            }
            if ($p.ExitCode -ne 0) {
              throw "Private registry login failed (exit code $($p.ExitCode))"
            }
          }
          finally {
            Remove-Item -Path $pwFile -Force -ErrorAction SilentlyContinue
          }

      # 8. Build and push Docker image
      - name: Build and push image
        shell: powershell
        timeout-minutes: 60
        run: |
          $ErrorActionPreference = "Continue"

          # Create small Docker build context
          $ctx = Join-Path $env:RUNNER_TEMP "docker-ctx"

          if (Test-Path $ctx) {
            Remove-Item -Recurse -Force $ctx
          }

          New-Item -ItemType Directory -Path "$ctx\Builds\Server" | Out-Null

          Copy-Item -Recurse Builds/Server/Linux "$ctx\Builds\Server\Linux"

          Copy-Item Dockerfile $ctx

          $tag = "${{ steps.meta.outputs.tag }}"

          # Build image with two tags
          docker build `
            -t "$env:IMAGE`:$tag" `
            -t "$env:IMAGE`:latest" `
            $ctx

          if ($LASTEXITCODE -ne 0) {
            throw "Docker build failed"
          }

          # The layers go to the registry over the home uplink. A slow upload can make the Docker daemon give up on one request
          # ("timeout awaiting response headers") and abort the whole push. Layers that are already stored are skipped on the next
          # attempt, so retrying converges instead of starting over.
          function Push-WithRetry([string]$Ref) {
            for ($i = 1; $i -le 4; $i++) {
              docker push $Ref
              if ($LASTEXITCODE -eq 0) { return }
              Write-Host "docker push $Ref failed (attempt $i of 4)"
              Start-Sleep -Seconds (10 * $i)
            }
            throw "Docker push failed for $Ref"
          }

          Push-WithRetry "$env:IMAGE`:$tag"
          Push-WithRetry "$env:IMAGE`:latest"

          Write-Host "Successfully pushed images:"
          Write-Host "$env:IMAGE`:$tag"
          Write-Host "$env:IMAGE`:latest"

  # 9. Update GitOps repository
  deploy-gitops:
    needs: build-and-push

    if: vars.DEPLOY_GITOPS == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main

      # Update image tags in Helm values
      - name: Update Helm image tags
        run: |
          for f in $GITOPS_VALUES; do
            if [ -f "$f" ]; then
              sed -i -E "s|^(\s*repository:\s*).*$|\1$IMAGE|" "$f"
              sed -i -E 's|^(\s*tag:\s*).*$|\1"${{ needs.build-and-push.outputs.tag }}"|' "$f"
            fi
          done

          git --no-pager diff -- $GITOPS_VALUES || true

      # Commit and push changes
      - name: Commit and push GitOps changes
        run: |
          git config user.name "railbound-ci"
          git config user.email "ci@railbound.invalid"

          for f in $GITOPS_VALUES; do
            [ -f "$f" ] && git add "$f"
          done

          git diff --cached --quiet && {
            echo "No changes detected"
            exit 0
          }

          git commit -m "ci(game-server): deploy ${{ needs.build-and-push.outputs.tag }}"

          git push origin HEAD:main
